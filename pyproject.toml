[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specguard"
version = "0.1.0.dev0"
description = "Generate a review-ready API test suite from an OpenAPI spec, then guard against contract drift."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Atharva Rane" }]
keywords = ["openapi", "pytest", "api-testing", "contract-testing", "drift"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "click>=8.1",
    "requests>=2.31",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
specguard = "specguard.cli:cli"

[project.urls]
Homepage = "https://github.com/athrvrne/specguard"

[tool.hatch.build.targets.wheel]
packages = ["specguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
